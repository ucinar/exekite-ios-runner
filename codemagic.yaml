# Exekite iOS export — the macOS leg of the tier-3 build lane.
#
# THIS FILE IS THE SOURCE OF TRUTH, but it does not run from this repo. Codemagic
# apps are bound to a git repository, and the thing being built is an arbitrary
# user's generated game, not this monorepo. So the shape is:
#
#   1. a small RUNNER REPO contains this file and prepare-ios.py at its root
#   2. it is connected to Codemagic ONCE as a single app
#   3. every per-project build is the same POST /builds against that appId and
#      this workflow key, with different environment variables
#   4. script one pulls the real project from a presigned R2 URL
#
# That is the same source-handoff contract the Android leg already uses
# (`apps/export-builder/container/run-job.sh`), which is why this is a second
# EXECUTOR and not a second protocol.
#
# Sync both files to the runner repo whenever either changes here. `pnpm test` in
# apps/export-builder asserts the two halves of the callback contract below stay
# byte-compatible with the Worker's signer.
#
# WHY iOS CANNOT USE THE CONTAINER: Godot's iOS exporter is macOS-gated, and
# Apple's licence forbids building iOS on non-Apple hardware. Renting macOS is
# not a shortcut, it is the only lawful path.

workflows:
  ios-godot:                      # ← this KEY is the API's workflowId, not `name`
    name: Exekite — Godot iOS build
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      groups:
        # Holds EXPORT_CALLBACK_SECRET (and, once per-user signing lands, the
        # signing material). Deliberately NOT passed per-build: anyone with
        # Codemagic team access can read a build's injected environment, and
        # this secret is long-lived, unlike the presigned URLs.
        - exekite_ios
      vars:
        GODOT_VERSION: "4.6.1"
        GODOT_PRESET: "iOS"
      xcode: latest
    cache:
      cache_paths:
        - $HOME/godot-bin
        - $HOME/Library/Application Support/Godot/export_templates
    # API-triggered only. Without this a push to the runner repo would burn
    # macOS minutes building nothing.
    triggering: {}

    scripts:
      - name: Guard — required inputs
        script: |
          set -euo pipefail
          for v in EXEKITE_JOB_ID EXEKITE_SOURCE_URL EXEKITE_ARTIFACT_PUT_URL \
                   EXEKITE_ARTIFACT_R2_KEY EXEKITE_CALLBACK_URL EXPORT_CALLBACK_SECRET; do
            eval "val=\${$v:-}"
            [ -n "$val" ] || { echo "missing required env: $v" >&2; exit 1; }
          done

      - name: Fetch the project
        script: |
          set -euo pipefail
          mkdir -p "$CM_BUILD_DIR/src"
          # No -v / no set -x: the URL is a bearer capability.
          curl -fsSL --retry 5 --retry-all-errors "$EXEKITE_SOURCE_URL" -o /tmp/source.tar.gz
          tar -xzf /tmp/source.tar.gz -C "$CM_BUILD_DIR/src"
          test -f "$CM_BUILD_DIR/src/project.godot" || {
            echo "source_invalid: no project.godot" >&2; exit 1; }

      # Split into one command per step ON PURPOSE. A combined step failed
      # with a bare "exited with status code 137" and Codemagic exposes no
      # stdout through the API (logUrl is null), so the STEP NAME is the only
      # diagnostic available — granularity is the log.
      - name: Probe machine
        script: |
          set -x
          sw_vers; uname -m; df -h /; sysctl -n hw.memsize; xcodebuild -version
      - name: Download Godot
        script: |
          set -euxo pipefail
          mkdir -p "$HOME/godot-bin"
          curl -fL --retry 5 --retry-all-errors -o /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_macos.universal.zip"
          ls -la /tmp/godot.zip
      - name: Unpack Godot
        script: |
          set -euxo pipefail
          unzip -q -o /tmp/godot.zip -d /tmp/godot
          find /tmp/godot -maxdepth 4 | head -20
      - name: Install Godot (keep the .app bundle intact)
        script: |
          set -euxo pipefail
          # DO NOT copy the executable out of Godot.app. Its code signature
          # covers the BUNDLE, so an executable lifted out of it has an invalid
          # signature — and on Apple Silicon an invalid signature is SIGKILL on
          # exec, which surfaces only as "exited with status code 137". That is
          # exactly how the first four builds died.
          rm -rf "$HOME/godot-bin"; mkdir -p "$HOME/godot-bin"
          APP=$(find /tmp/godot -maxdepth 2 -name 'Godot*.app' -type d | head -1)
          test -n "$APP"
          cp -R "$APP" "$HOME/godot-bin/Godot.app"
          xattr -dr com.apple.quarantine "$HOME/godot-bin/Godot.app" 2>/dev/null || true
          # Re-sign ad-hoc in case the copy disturbed anything; harmless if the
          # original signature is already valid.
          codesign --force --deep --sign - "$HOME/godot-bin/Godot.app" 2>/dev/null || true
          codesign -dv "$HOME/godot-bin/Godot.app" 2>&1 | head -3 || true
          ls -la "$HOME/godot-bin/Godot.app/Contents/MacOS/"

      - name: Godot version check
        script: |
          set -euxo pipefail
          "$HOME/godot-bin/Godot.app/Contents/MacOS/Godot" --headless --version

      - name: Download iOS export templates
        script: |
          set -euxo pipefail
          TPL="$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$TPL"
          curl -fL --retry 5 --retry-all-errors -o /tmp/templates.tpz \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          ls -la /tmp/templates.tpz
          unzip -j -o -q /tmp/templates.tpz 'templates/ios*' -d "$TPL"
          rm -f /tmp/templates.tpz
          ls -la "$TPL"

      - name: Prepare current Ship identity and iOS preset
        script: |
          set -euo pipefail
          python3 "$CM_BUILD_DIR/prepare-ios.py" "$CM_BUILD_DIR/src"

      - name: Godot import + iOS export
        # Codemagic exposes no stdout through the API (logUrl is null), so the
        # step tees everything into a file that is published as an artifact.
        # Keep the log on failure; the archive step requires the success receipt.
        ignore_failure: true
        script: |
          set -uo pipefail
          BIN="$HOME/godot-bin/Godot.app/Contents/MacOS/Godot"
          mkdir -p "$CM_BUILD_DIR/build/ios"
          LOG="$CM_BUILD_DIR/build/ios/export.log"
          RECEIPT="$CM_BUILD_DIR/build/ios/.godot-exported"
          rm -f "$RECEIPT" "$CM_BUILD_DIR/build/ios/.uploaded"
          cd "$CM_BUILD_DIR/src"
          export_project() {
            echo "== import pass 1 =="
            if ! "$BIN" --headless --path . --import; then
              echo "== import retry =="
              "$BIN" --headless --path . --import || return $?
            fi
            echo "== export (verbose) =="
            "$BIN" --headless --verbose --path . --export-release "$GODOT_PRESET" "$CM_BUILD_DIR/build/ios/game.ipa" || return $?
            printf 'verified\n' > "$RECEIPT"
          }
          export_project 2>&1 | tee "$LOG"
          exit "${PIPESTATUS[0]}"

      - name: Archive + export IPA
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/build/ios"
          test -f .godot-exported || { echo "Godot import/export was not verified" >&2; exit 1; }
          PROJ=$(ls -d ./*.xcodeproj 2>/dev/null | head -1)
          [ -n "$PROJ" ] || { echo "no xcodeproj produced by Godot export" >&2; exit 1; }
          SCHEME=$(xcodebuild -project "$PROJ" -list -json \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["project"]["schemes"][0])')
          # UNSIGNED by default. Signing needs the user's own Apple Developer
          # account (App Review 4.2.6 requires it), and that custody flow is a
          # separate phase — see docs/future/ios-export-lane.md. An unsigned
          # .ipa proves the whole Godot -> xcodeproj -> archive chain and is
          # installable via re-signing tools; it is NOT App Store ready, and
          # the UI says so rather than implying otherwise.
          xcodebuild -project "$PROJ" -scheme "$SCHEME" -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/game.xcarchive" archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          # `xcodebuild -exportArchive` cannot export an unsigned archive, so
          # hand-pack the Payload/ layout an .ipa actually is.
          rm -rf Payload && mkdir -p Payload
          cp -R game.xcarchive/Products/Applications/*.app Payload/
          rm -f "$CM_BUILD_DIR/build/ios/game.ipa"
          zip -qry "$CM_BUILD_DIR/build/ios/game.ipa" Payload
          test -s "$CM_BUILD_DIR/build/ios/game.ipa"

      - name: Upload the artifact
        script: |
          set -euo pipefail
          IPA="$CM_BUILD_DIR/build/ios/game.ipa"
          # An .ipa is a zip of a whole Godot runtime; anything this small is a
          # packaging accident, not a game. Mirrors the Android leg's floor.
          BYTES=$(stat -f%z "$IPA")
          [ "$BYTES" -ge 5000000 ] || { echo "ipa suspiciously small: $BYTES" >&2; exit 1; }
          unzip -tq "$IPA" || { echo "IPA archive integrity check failed" >&2; exit 1; }
          curl -fsS -X PUT --data-binary @"$IPA" \
            -H 'content-type: application/octet-stream' \
            "$EXEKITE_ARTIFACT_PUT_URL"
          # THE SUCCESS RECEIPT. Written only after the PUT returns 2xx, and it
          # is the ONLY thing the callback below trusts — see its comment.
          echo "$BYTES" > "$CM_BUILD_DIR/build/ios/.uploaded"

    artifacts:
      - build/ios/export.log
      - build/ios/game.ipa
      - build/ios/*.xcarchive

    publishing:
      scripts:
        - name: Signed callback to the router
          script: |
            set -euo pipefail
            # Runs on success AND failure, which is the point: Codemagic has no
            # generic completion webhook, so the build reports its own outcome.
            # The job's timeout alarm still backstops a runner that dies before
            # reaching this step.
            #
            # THE ARTIFACT IS THE TRUTH — never the vendor's status variable.
            # This branched on `CM_BUILD_STEP_STATUS` and reported `failed` for
            # a build that had produced, verified AND uploaded a 41 MB .ipa
            # (measured 2026-08-08): every step read `success` in the API while
            # the callback said the opposite, so the Ship page showed a failure
            # for a game that had genuinely shipped. The variable's semantics in
            # a publishing script are undocumented enough that `:-failure`
            # silently converted "unset" into "the build failed".
            #
            # `.uploaded` is written only after verified native export, archive
            # integrity and a successful PUT. It is cleared before each attempt.
            echo "diag: CM_BUILD_STEP_STATUS=${CM_BUILD_STEP_STATUS:-<unset>}"
            if [ -f "$CM_BUILD_DIR/build/ios/.uploaded" ]; then
              BODY=$(python3 -c 'import json,os; print(json.dumps({"status":"built","artifact_r2_key":os.environ["EXEKITE_ARTIFACT_R2_KEY"]},separators=(",",":")))')
            else
              BODY=$(python3 -c 'import json; print(json.dumps({"status":"failed","error":"ios build failed on codemagic"},separators=(",",":")))')
            fi
            # Lowercase hex HMAC-SHA256 over the RAW body bytes, header
            # X-Export-Signature — byte-identical to run-job.sh and to the
            # Worker's `signCallback`.
            SIG=$(printf '%s' "$BODY" | openssl dgst -sha256 -hmac "$EXPORT_CALLBACK_SECRET" | awk '{print $NF}')
            curl -fsS -X POST "$EXEKITE_CALLBACK_URL" \
              -H "X-Export-Signature: $SIG" \
              -H 'content-type: application/json' \
              --data-binary "$BODY"
